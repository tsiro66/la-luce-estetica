# PagesCMS configuration (schema v2) — https://pagescms.org
# Sign in at https://app.pagescms.org with GitHub and select this repo + branch to edit content.
# Changes are committed directly to the branch; your deployment rebuilds on push.

media:
  input: public/uploads
  output: /uploads
  extensions: [avif, gif, jpg, jpeg, png, svg, webp]

content:
  # ---------- Global settings (header, footer, nav, SEO) ----------
  - name: site
    label: Site Settings
    type: file
    path: src/data/site.json
    format: json
    fields:
      - name: siteName
        label: Site name
        type: string
        required: true
        description: Used in the browser tab, mobile menu and footer.
      - name: wordmark
        label: Header wordmark
        type: object
        fields:
          - name: main
            label: Main line (e.g. "La Luce")
            type: string
            required: true
          - name: sub
            label: Sub line, letter-spaced (e.g. "Estetica")
            type: string
            required: true
      - name: treatwellUrl
        label: Treatwell booking URL
        type: string
        required: true
        description: All "Book" buttons point here.
      - name: bookCta
        label: Header booking button label
        type: string
      - name: mobileBookCta
        label: Mobile menu booking button label
        type: string
      - name: backHomeLabel
        label: '"Back to Home" button label'
        type: string
      - name: comingSoonLabel
        label: Placeholder pages eyebrow label
        type: string
      - name: menuLabels
        label: Mobile menu labels
        type: object
        fields:
          - name: open
            label: Menu button label
            type: string
          - name: close
            label: Close button label
            type: string
      - name: seo
        label: Default SEO
        type: object
        fields:
          - name: defaultTitle
            label: Default page title
            type: string
          - name: defaultDescription
            label: Default meta description
            type: text
      - name: nav
        label: Navigation links
        type: object
        list: true
        fields:
          - name: label
            type: string
          - name: href
            label: Path
            type: string
            description: "Internal pages: /services, /studio, /faq, /contact"
      - name: footer
        type: object
        fields:
          - name: tagline
            label: Footer tagline
            type: text
          - name: headings
            label: Column headings
            type: object
            fields:
              - name: explore
                type: string
              - name: visit
                type: string
              - name: hours
                type: string
          - name: socials
            type: object
            list: true
            fields:
              - name: label
                type: string
              - name: href
                label: URL
                type: string
          - name: mapUrl
            label: Google Maps directions URL
            type: string
          - name: mapLabel
            label: Directions link label
            type: string
          - name: address
            type: object
            fields:
              - name: street
                type: string
              - name: city
                type: string
          - name: email
            type: string
          - name: phone
            type: string
            description: "Displayed as-is; the tel: link is generated automatically."
          - name: hours
            label: Opening hours
            type: object
            list: true
            fields:
              - name: days
                type: string
              - name: time
                type: string
          - name: bookLabel
            label: '"Book via Treatwell" link label'
            type: string
          - name: copyright
            label: Copyright name
            type: string
          - name: note
            label: Bottom bar note
            type: string

  # ---------- Home page ----------
  - name: home
    label: Home Page
    type: file
    path: src/data/home.json
    format: json
    fields:
      - name: hero
        label: Hero
        type: object
        fields:
          - name: eyebrow
            label: Eyebrow / tagline
            type: string
          - name: titleStart
            label: Headline — before accent
            type: string
          - name: titleAccent
            label: Headline — italic accent
            type: string
          - name: titleEnd
            label: Headline — after accent
            type: string
          - name: description
            type: text
          - name: primaryCta
            label: Primary button label (books via Treatwell)
            type: string
          - name: secondaryCta
            label: Secondary button label (goes to Services)
            type: string
          - name: scrollLabel
            label: Scroll cue text
            type: string
          - name: video
            label: Hero background video URL
            type: string
            description: mp4/webm URL. When set, replaces the hero photo with an autoplaying muted loop.
          - name: image
            label: Background image
            type: image
            description: Leave empty to keep the built-in default photo.
      - name: marquee
        label: Scrolling marquee items
        type: string
        list: true
      - name: featured
        label: Featured treatments section
        type: object
        fields:
          - name: eyebrow
            type: string
          - name: titleStart
            label: Heading — before accent
            type: string
          - name: titleAccent
            label: Heading — italic accent
            type: string
          - name: cta
            label: '"View all" link label'
            type: string
      - name: studioTeaser
        label: Studio teaser section
        type: object
        fields:
          - name: eyebrow
            type: string
          - name: titleStart
            label: Heading — before accent
            type: string
          - name: titleAccent
            label: Heading — italic accent
            type: string
          - name: description
            type: text
          - name: cta
            label: Link label
            type: string
          - name: image
            type: image
            description: Leave empty to show the placeholder frame instead.
          - name: imagePlaceholder
            label: Placeholder text (shown while no image is set)
            type: string
      - name: booking
        label: Booking banner
        type: object
        fields:
          - name: eyebrow
            type: string
          - name: titleStart
            label: Headline — before accent
            type: string
          - name: titleAccent
            label: Headline — italic accent
            type: string
          - name: titleEnd
            label: Headline — after accent
            type: string
          - name: description
            type: text
          - name: cta
            label: Button label (books via Treatwell)
            type: string

  # ---------- Placeholder pages ----------
  - name: pages
    label: Page Meta
    type: file
    path: src/data/pages.json
    format: json
    fields:
      - name: services
        label: Services page
        type: object
        fields:
          - name: title
            type: string
          - name: note
            type: text
      - name: studio
        label: Studio page
        type: object
        fields:
          - name: title
            type: string
          - name: note
            type: text
      - name: faq
        label: FAQ page
        type: object
        fields:
          - name: title
            type: string
          - name: note
            type: text
      - name: contact
        label: Contact page
        type: object
        fields:
          - name: title
            type: string
          - name: note
            type: text

  # ---------- Contact page ----------
  - name: contact
    label: Contact Page
    type: file
    path: src/data/contact.json
    format: json
    fields:
      - name: eyebrow
        type: string
      - name: titleStart
        label: Heading, first part
        type: string
      - name: titleAccent
        label: Heading, italic accent
        type: string
      - name: intro
        type: text
      - name: visitHeading
        type: string
      - name: callHeading
        type: string
      - name: hoursHeading
        type: string
      - name: bookHeading
        type: string
      - name: replyNote
        label: Microcopy under submit button
        type: string
      - name: fields
        type: object
        fields:
          - name: name
            type: object
            fields:
              - name: label
                type: string
              - name: placeholder
                type: string
          - name: email
            type: object
            fields:
              - name: label
                type: string
              - name: placeholder
                type: string
          - name: phone
            type: object
            fields:
              - name: label
                type: string
              - name: placeholder
                type: string
          - name: treatment
            type: object
            fields:
              - name: label
                type: string
              - name: placeholder
                type: string
              - name: options
                type: list
          - name: message
            type: object
            fields:
              - name: label
                type: string
              - name: placeholder
                type: string
      - name: submitLabel
        type: string
      - name: success
        type: object
        fields:
          - name: titleStart
            label: Success heading, first part
            type: string
          - name: titleAccent
            label: Success heading, italic accent
            type: string
          - name: body
            type: text
          - name: again
            label: Send another link label
            type: string
      - name: errorTitle
        label: Error heading
        type: string
      - name: errorBody
        label: Error body
        type: text
      - name: errors
        type: object
        fields:
          - name: name
            type: string
          - name: email
            type: string
          - name: message
            type: string
          - name: treatment
            type: string
          - name: general
            type: string

  # ---------- Treatments ----------
  - name: treatments
    label: Treatments
    type: collection
    path: src/content/treatments
    filename: "{primary}.md"
    view:
      primary: title
      sort: order
      order: asc
    fields:
      - name: title
        label: Treatment name
        type: string
        required: true
      - name: category
        label: Category / eyebrow
        type: string
        description: 'Shown next to the number, e.g. "Body Treatment".'
      - name: duration
        type: string
        description: "e.g. 45 min"
      - name: pageTitle
        label: SEO page title
        type: string
        description: 'Full page title for search engines, e.g. "…στο Χαλάνδρι".'
      - name: subtitle
        label: Subtitle
        type: text
        description: Italic line shown under the treatment title.
      - name: duration
        type: string
        description: "e.g. 45 λεπτά"
      - name: order
        type: number
        options:
          min: 1
        description: Controls the position within its category (1 = first).
      - name: bestseller
        type: boolean
        default: false
        description: Best sellers are shown on the homepage.
      - name: problems
        label: "Which problem does it solve?"
        type: text
        list: true
      - name: benefits
        label: Benefits & advantages
        type: text
        list: true
      - name: before
        label: Before the session — steps
        type: text
        list: true
      - name: after
        label: After the session — steps
        type: text
        list: true
      - name: faq
        label: FAQ
        type: object
        list: true
        fields:
          - name: q
            label: Question
            type: string
          - name: a
            label: Answer
            type: text
      - name: info
        label: General info
        type: object
        fields:
          - name: resultDuration
            label: Result duration
            type: string
          - name: pain
            label: Pain level
            type: string
          - name: recovery
            label: Recovery
            type: string
      - name: body
        label: Description
        type: rich-text
